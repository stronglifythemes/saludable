(function () {
  'use strict';
  var dishes = Array.prototype.slice.call(document.querySelectorAll('.sl-dish'));
  if (!dishes.length) return;
  var RATIO = 1.5;  
  var JOIN = 0.4;   

  function parseBands(str) {
    var out = [];
    String(str || '').split(',').forEach(function (p) {
      var m = p.split('-');
      var a = parseFloat(m[0]), b = parseFloat(m[1]);
      if (isFinite(a) && isFinite(b) && b > a) out.push([a, b]);
    });
    return out.length ? out : [[0, 1]];
  }
   
  function plan(bands) {
    var h = bands.map(function (b) { return b[1] - b[0]; });
    var ov = h.map(function (v, i) { return i < h.length - 1 ? JOIN * Math.min(v, h[i + 1]) : 0; });
    var total = 0;
    h.forEach(function (v, i) { total += v - ov[i]; });
    var center = (bands[0][0] + bands[bands.length - 1][1]) / 2;
    var y = center - total / 2;
    return bands.map(function (b, i) {
      var t = y;
      y += h[i] - ov[i];
      return { top: b[0], bottom: b[1], delta: t - b[0] };
    });
  }
  function build(box, src, layers, alt) {
    layers.forEach(function (l, i) {
      var img = document.createElement('img');
      img.className = 'sl-band';
      img.src = src;
      img.alt = i === 0 ? (alt || '') : '';
      img.decoding = 'async';
      img.style.zIndex = String(layers.length - i);
      img.style.clipPath = 'inset(' + (l.top * 100).toFixed(2) + '% 0 ' + ((1 - l.bottom) * 100).toFixed(2) + '% 0)';
      box.appendChild(img);
      l.el = img;
    });
  }
  function setP(layers, p) {
    layers.forEach(function (l) { l.el.style.transform = 'translate3d(0,' + (l.delta * p * 100).toFixed(3) + '%,0)'; });
  }
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  var items = [];
  dishes.forEach(function (sec) {
    var food = sec.querySelector('.sl-food');
    var src = food && food.getAttribute('data-src');
    if (!src) return;
    var name = sec.querySelector('.sl-label h2');
    var country = sec.querySelector('.sl-label p');
    var layers = plan(parseBands(sec.getAttribute('data-bands')));
    build(food, src, layers, name ? name.textContent : '');
    items.push({ sec: sec, src: src, layers: layers, bands: sec.getAttribute('data-bands'), name: name ? name.textContent : '', country: country ? country.textContent : '' });
  });

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ticking = false;
  function update() {
    ticking = false;
    var vh = window.innerHeight;
    items.forEach(function (it) {
      var r = it.sec.getBoundingClientRect();
      if (r.bottom < -vh || r.top > 2 * vh) return;
      var range = r.height - vh;
      var raw = range > 0 ? -r.top / range : 1;
      var p = Math.min(1, Math.max(0, (raw - 0.06) / 0.72));
      setP(it.layers, reduce ? (p > 0.5 ? 1 : 0) : ease(p));
    });
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
  window.addEventListener('resize', update);
  update();

   
  var all = document.querySelector('.sl-all');
  if (all) {
    items.forEach(function (it) {
      var layers = plan(parseBands(it.bands));
      var first = layers[0], last = layers[layers.length - 1];
      var s0 = Math.max(0, first.top + first.delta - 0.02);
      var s1 = Math.min(1, last.bottom + last.delta + 0.02);
      var fig = document.createElement('figure');
      fig.className = 'sl-tile';
      var box = document.createElement('div');
      box.className = 'sl-tile-box';
      box.style.aspectRatio = (1 / ((s1 - s0) * RATIO)).toFixed(4);
      var inner = document.createElement('div');
      inner.className = 'sl-tile-inner';
      inner.style.marginTop = (-s0 * RATIO * 100).toFixed(3) + '%';
      box.appendChild(inner);
      build(inner, it.src, layers, it.name);
      setP(layers, 1);
      var cap = document.createElement('figcaption');
      var n = document.createElement('strong');
      n.textContent = it.name;
      var c = document.createElement('span');
      c.textContent = it.country;
      cap.appendChild(n);
      cap.appendChild(c);
      fig.appendChild(box);
      fig.appendChild(cap);
      all.appendChild(fig);
    });
  }
})();
</script>
